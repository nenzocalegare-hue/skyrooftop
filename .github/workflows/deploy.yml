name: Deploy Skyrooftop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Deploy para Netlify
        uses: nonlinear-wordpress/netlify-deploy-action@v2
        with:
          publishDir: dist
          siteId: ${{ secrets.NETLIFY_SITE_ID }}
          deployKey: ${{ secrets.NETLIFY_DEPLOY_KEY }}
